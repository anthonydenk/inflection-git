<meta charset="utf-8"><title>Duotone calibrations</title>
<style>
body{margin:0;background:#F6FAF7;font:14px/1.6 "Archivo",system-ui,sans-serif;color:#0B2E20;padding:40px}

.b img{filter:url(#duo-b)}

.d img{filter:url(#duo-d)}
</style>

      <feFuncR type="table" tableValues="0.043 0.290 0.914"/>
      <feFuncG type="table" tableValues="0.180 0.478 0.949"/>
      <feFuncB type="table" tableValues="0.125 0.388 0.925"/>

  </filter>
  <filter id="duo-c" color-interpolation-filters="sRGB">

  <filter id="duo-d" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0 0 0 1 0"/>

<h1>Duotone calibrations — brand green</h1>
<p class="sub">Same photographs, four treatments. All map shadows to evergreen #0B2E20; they differ in midtone depth and highlight ceiling.</p>

  <figure class="b"><div class="f"><img src="../assets/team/justin-kunz-960.webp" alt=""></div><figcaption>B — Applied now<em>Bright mint highlights, saturated mid</em></figcaption></figure>
  <figure class="c"><div class="f"><img src="../assets/team/justin-kunz-960.webp" alt=""></div><figcaption>C — Deeper<em>Muted mid, softer ceiling — most institutional</em></figcaption></figure>
